<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=block" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}
body{width:1075px;height:650px;font-family:"Noto Sans JP",sans-serif;background:#23408e;color:#fff;display:flex;align-items:center;gap:60px;padding:0 80px}
.qr{background:#fff;padding:22px;border-radius:24px}
.qr img{width:380px;height:380px;display:block;image-rendering:pixelated}
h2{font-weight:900;font-size:44px;line-height:1.3}
h2 em{font-style:normal;color:#ffd23f}
p{font-size:27px;font-weight:500;line-height:1.7;margin-top:22px;opacity:.95}
.id{margin-top:10px;font-weight:900;font-size:32px}
.me{margin-top:24px;background:rgba(255,255,255,.12);border-radius:16px;padding:14px 22px}
.me p{margin:4px 0;font-size:30px;font-weight:700;line-height:1.5}
.me span{display:inline-block;font-size:22px;font-weight:900;border-radius:999px;padding:2px 14px;margin-right:14px;vertical-align:middle}
.ok{background:#ffd23f;color:#23408e}.ng{background:#fff;color:#23408e}
.small{font-size:24px!important;margin-top:16px!important}
</style></head><body>
<div class="qr"><img src="line_qr.png"></div>
<div><h2>ご相談は<em>LINE</em>から<br>お気軽に</h2>
<div class="me"><p><span class="ok">得意なこと</span>市場分析</p><p><span class="ng">苦手なこと</span>話すこと</p></div>
<p class="small">セミナーのご案内もLINEで</p>
<p class="id">LINE ID：@031svhsj</p></div>
</body></html>
