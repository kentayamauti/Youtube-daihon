<!doctype html><html><head><meta charset="utf-8">
<!--
  料理チャンネル型のサムネ（伸びている料理動画の型：syun cooking・HIRO SWEETS）。1280×720。
  写真を画面いっぱいに1〜2枚（全体＋断面）、上と下に白い太字＋黒の太い縁取りを1行ずつ。キャラ・顔は出さない。
  ?top=上の文字&bottom=下の文字&bg=写真1&bg2=写真2&badge=小さい丸の文字
-->
<style>
@font-face{font-family:"NotoBlack";src:url("../fonts/NotoSansJP-Black.ttf")}
html{height:720px}
body{position:relative;margin:0;width:1280px;height:720px;overflow:hidden;background:#ddd;font-family:"NotoBlack",sans-serif}
.ph{position:absolute;top:0;height:720px;background-size:cover;background-position:center}
.t{position:absolute;left:0;width:1280px;text-align:center;white-space:nowrap;color:#fff;font-size:128px;line-height:1.1;
  -webkit-text-stroke:18px #111;paint-order:stroke fill;letter-spacing:-2px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.top{top:0}.bottom{bottom:4px}
.t span{display:inline-block}
.badge{position:absolute;left:40px;bottom:150px;background:#fff;color:#111;border:4px solid #111;border-radius:40px;padding:0 22px;font-size:44px}
</style></head><body>
<div class="ph" id="p1"></div><div class="ph" id="p2"></div>
<div class="t top"><span id="top"></span></div>
<div class="t bottom"><span id="bottom"></span></div>
<div class="badge" id="badge"></div>
<script>
const q=new URLSearchParams(location.search);
const p1=document.getElementById('p1'),p2=document.getElementById('p2');
p1.style.backgroundImage=`url(${q.get('bg')||'food_placeholder.svg'})`;
if(q.get('bg2')){p1.style.left='0';p1.style.width='640px';p2.style.left='640px';p2.style.width='640px';p2.style.backgroundImage=`url(${q.get('bg2')})`}
else {p1.style.left='0';p1.style.width='1280px';p2.remove()}
document.getElementById('top').textContent=q.get('top')||'';
document.getElementById('bottom').textContent=q.get('bottom')||'';
const b=document.getElementById('badge'); if(q.get('badge')) b.textContent=q.get('badge'); else b.remove();
document.fonts.ready.then(()=>{for(const id of ['top','bottom']){const el=document.getElementById(id);let fs=128;
  while(el.getBoundingClientRect().width>1250&&fs>40){fs-=4;el.style.fontSize=fs+'px'}}});
</script></body></html>
